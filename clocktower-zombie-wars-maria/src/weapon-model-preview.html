<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Maria 九把枪械模型预览</title>
    <link rel="stylesheet" href="/weapon-model-preview.css" />
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">PLAYER WEAPON ART REVIEW</p>
        <h1>Q 版街机角色 · 九把枪械独立握持</h1>
        <p id="previewStatus" role="status">正在加载 Q 版角色与逐武器手型……</p>
        <div class="mode-controls" role="group" aria-label="预览模式">
          <button id="showAimMode" type="button" aria-pressed="true">八向持枪</button>
          <button id="showFrontMode" type="button" aria-pressed="false">正面带脸</button>
        </div>
        <div id="directionControls" class="controls" aria-label="瞄准方向控制">
          <button id="previousDirection" type="button">上一个方向</button>
          <strong id="directionLabel">右</strong>
          <button id="nextDirection" type="button">下一个方向</button>
          <button id="toggleAuto" type="button" aria-pressed="true">暂停轮播</button>
        </div>
      </header>
      <section
        id="weaponPreviewGrid"
        class="weapon-grid"
        aria-label="九把枪械预览"
      ></section>
    </main>
    <script type="module" src="/weapon-model-preview.js"></script>
  </body>
</html>
